<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คิวงานซ่อมอุปกรณ์สื่อ — บ.ฉ.๒</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2A5B; --navy-deep:#071D40; --blue:#1A4FB4; --blue-dark:#123A87;
    --gold:#FFC426; --gold-deep:#D19700;
    --ink:#15203A; --muted:#5C6782; --paper:#F3F6FC; --surface:#fff;
    --line:#DCE3F2;
    --doing:#1A4FB4; --hold:#6B4E9E; --done:#127A55; --cancel:#79839B; --danger:#B3261E;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:'Anuphan',system-ui,sans-serif;font-size:16px;line-height:1.6}
  .wrap{max-width:940px;margin:0 auto;padding:0 18px 72px}

  header{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);
         color:#fff;border-bottom:4px solid var(--gold);padding:24px 0 22px;margin-bottom:22px}
  header .wrap{padding-bottom:0}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{width:52px;height:52px;object-fit:contain;flex:none}
  .brand h1{font-size:23px;font-weight:700;margin:0;letter-spacing:-.01em}
  .brand p{margin:2px 0 0;font-size:14px;color:#BFD0EE}
  .brand a{color:#FFDD7A;text-decoration:none;font-weight:500}
  .brand a:hover{text-decoration:underline}

  /* ---------- ตัวเลขสรุป ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
        box-shadow:0 1px 2px rgba(11,42,91,.05)}
  .stat b{display:block;font-size:30px;font-weight:700;line-height:1.15;color:var(--navy)}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.lead{background:var(--navy);border-color:var(--navy)}
  .stat.lead b{color:var(--gold)}
  .stat.lead span{color:#BFD0EE}
  .stat.rooms b{font-size:15px;font-weight:500;color:var(--ink);line-height:1.7}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .toolbar input,.toolbar select{padding:11px 13px;border:1px solid var(--line);border-radius:10px;
       font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .toolbar input{flex:1;min-width:200px}
  .toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--blue);
       box-shadow:0 0 0 3px rgba(26,79,180,.15)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
        margin-bottom:14px;box-shadow:0 1px 2px rgba(11,42,91,.05)}
  .card.urgent{border-left:4px solid var(--gold)}
  .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .id{font-weight:700;color:var(--navy)}
  .room{font-size:18px;font-weight:600;margin:5px 0 2px}
  .detail{margin:8px 0}
  .meta{font-size:13px;color:var(--muted)}
  .sevtag{font-weight:600;color:var(--gold-deep)}
  .badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;color:#fff;white-space:nowrap}
  .b-wait{background:var(--gold);color:#4A3600} .b-doing{background:var(--doing)}
  .b-hold{background:var(--hold)} .b-done{background:var(--done)} .b-cancel{background:var(--cancel)}

  .edit{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
        display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .edit select,.edit input{padding:11px 12px;border:1px solid var(--line);border-radius:10px;
        font-family:inherit;font-size:15px;width:100%;background:#fff;color:var(--ink)}
  .edit select:focus,.edit input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,79,180,.15)}
  .edit .full{grid-column:1 / -1}
  button{font-family:inherit;font-weight:600;border-radius:10px;cursor:pointer;border:1px solid transparent;
        background:var(--blue);color:#fff;padding:11px 20px;font-size:15px}
  button:hover{background:var(--blue-dark)}
  button:disabled{background:var(--cancel);cursor:progress}
  a.photo{font-size:14px;color:var(--blue);font-weight:500}
  .empty,.loading{color:var(--muted)}
  .msg{padding:14px 16px;border-radius:12px;margin-bottom:16px;background:#EAF6F0;border:1px solid #A6D5BE;color:#0D5C3F}
  .msg.err{background:#FDECEA;border-color:#EFB6B0;color:var(--danger)}

  .gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);
        display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
  .gate .box{background:#fff;border-radius:16px;padding:28px;max-width:400px;width:100%;
             border-top:5px solid var(--gold);text-align:center}
  .gate img{width:64px;height:64px;object-fit:contain;margin-bottom:12px}
  .gate h2{margin:0 0 6px;font-size:19px}
  .gate p{margin:0 0 18px;font-size:14px;color:var(--muted)}
  .gate input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;
              font-family:inherit;font-size:16px;margin-bottom:12px;text-align:center}
  .gate input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,79,180,.15)}
  .gate button{width:100%;padding:14px}
  .hidden{display:none}

  footer{border-top:1px solid var(--line);margin-top:26px;padding:20px 0 0;
         text-align:center;font-size:13px;color:var(--muted);line-height:1.8}
  footer b{display:block;font-weight:600;color:var(--ink);font-size:14px}

  .owner{display:flex;align-items:center;gap:9px;margin:10px 0 2px}
  .owner img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;
             border:2px solid var(--gold);background:#E8EDF7}
  .owner .ph{width:34px;height:34px;border-radius:50%;flex:none;background:var(--navy);color:#fff;
             display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
  .owner .nm{font-size:14px;font-weight:600}
  .owner .role{font-size:12px;color:var(--muted)}

  @media (max-width:520px){ .edit{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <h2>คิวงานซ่อมอุปกรณ์สื่อ</h2>
    <p>หน้านี้สำหรับครูผู้ดูแลงานโสตทัศนูปกรณ์</p>
    <input type="password" id="pin" placeholder="รหัสผู้ดูแล" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()" id="loginBtn">เข้าสู่ระบบ</button>
    <p id="gateErr" style="color:var(--danger);margin:12px 0 0"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="wrap">
      <div class="brand">
        <img src="logo.png" alt="" onerror="this.style.display='none'">
        <div>
          <h1>คิวงานซ่อมอุปกรณ์สื่อ</h1>
          <p>โรงเรียนเบญจมราชรังสฤษฎิ์ ๒ · <a href="index.html">ไปหน้าแจ้งซ่อม</a></p>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div id="alert"></div>
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="text" id="q" placeholder="ค้นหาเลขห้อง ชื่อห้อง อุปกรณ์ หรือผู้แจ้ง" oninput="render()">
      <select id="fbuilding" onchange="render()"><option value="">ทุกอาคาร</option></select>
      <select id="fyear" onchange="load()"></select>
      <select id="fstatus" onchange="render()">
        <option value="open">เฉพาะงานค้าง</option>
        <option value="">ทั้งหมด</option>
      </select>
    </div>

    <div id="list" class="loading">กำลังโหลดคิวงาน…</div>

    <footer>
      <b>พัฒนาระบบโดย ครูสุทธิพงษ์ สุขสร้อย</b>
      โรงเรียนเบญจมราชรังสฤษฎิ์ ๒ จังหวัดฉะเชิงเทรา
    </footer>
  </div>
</div>

<script src="config.js"></script>
<script>
  var TICKETS = [], STATUSES = [], BUILDINGS = [], PHOTOS = {}, PIN = sessionStorage.getItem('ben2_repair_pin') || '';

  function apiPost(body, done, fail){
    body.pin = PIN;
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    })
    .then(function(r){ return r.json(); })
    .then(function(res){ res.ok ? done(res.data) : fail(new Error(res.error)); })
    .catch(fail);
  }

  function apiGet(action, params, done, fail){
    var cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    var qs = ['action=' + encodeURIComponent(action), 'callback=' + cb];
    Object.keys(params || {}).forEach(function(k){ qs.push(k + '=' + encodeURIComponent(params[k])); });
    var s = document.createElement('script');
    window[cb] = function(res){ delete window[cb]; s.remove(); res.ok ? done(res.data) : fail(new Error(res.error)); };
    s.src = API_URL + '?' + qs.join('&');
    document.body.appendChild(s);
  }

  if (PIN) login(true);

  function login(silent){
    if (!silent) {
      PIN = document.getElementById('pin').value.trim();
      if (!PIN) return;
      document.getElementById('loginBtn').disabled = true;
    }
    apiPost({ action: 'checkPin' }, function(){
      sessionStorage.setItem('ben2_repair_pin', PIN);
      document.getElementById('gate').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      apiGet('bootstrap', {}, function(d){
        STATUSES = d.statuses;
        BUILDINGS = d.buildings || [];
        PHOTOS = {};
        BUILDINGS.forEach(function(b){
          (b.caretakers || []).forEach(function(c){ PHOTOS[c.name] = c.photo || ''; });
        });
        (d.rooms || []).forEach(function(r){
          (r.caretakers || []).forEach(function(c){ PHOTOS[c.name] = c.photo || ''; });
        });
        document.getElementById('fbuilding').innerHTML = '<option value="">ทุกอาคาร</option>' +
          BUILDINGS.map(function(b){
            var care = (b.caretakers || []).map(function(c){ return c.name; }).join(', ');
            return '<option value="' + b.code + '">' + (b.name || 'อาคาร ' + b.code) +
                   (care ? ' — ' + care : '') + '</option>';
          }).join('');
        document.getElementById('fyear').innerHTML =
          d.years.map(function(y){
            return '<option value="' + y + '"' + (y === String(d.currentYear) ? ' selected' : '') + '>' +
                   'ปีการศึกษา ' + y + '</option>';
          }).join('') + '<option value="">ทุกปีการศึกษา</option>';
        load();
      }, function(){});
    }, function(err){
      sessionStorage.removeItem('ben2_repair_pin');
      document.getElementById('loginBtn').disabled = false;
      if (!silent) document.getElementById('gateErr').textContent = err.message;
    });
  }

  function load(){
    var year = document.getElementById('fyear').value;
    apiPost({ action: 'listAll', year: year }, function(list){ TICKETS = list; render(); },
      function(e){ document.getElementById('list').textContent = e.message; });
    apiPost({ action: 'summary', year: year }, renderStats, function(){});
  }

  function renderStats(s){
    document.getElementById('stats').innerHTML =
      '<div class="stat lead"><b>' + s.open + '</b><span>งานค้างทั้งหมด</span></div>' +
      stat(s.byStatus['รอดำเนินการ'] || 0, 'รอดำเนินการ') +
      stat(s.byStatus['กำลังดำเนินการ'] || 0, 'กำลังดำเนินการ') +
      stat(s.byStatus['เสร็จสิ้น'] || 0, 'ซ่อมเสร็จแล้ว') +
      (s.openByBuilding && s.openByBuilding.length ? '<div class="stat rooms"><b>' +
        s.openByBuilding.map(function(b){
          return (b.name || 'อาคาร ' + b.building) + ' — ' + b.count + ' งาน' +
                 (b.caretaker ? ' (' + b.caretaker + ')' : '');
        }).join('<br>') + '</b><span>งานค้างแยกตามอาคาร</span></div>' : '');
  }
  function stat(n, label){ return '<div class="stat"><b>' + n + '</b><span>' + label + '</span></div>'; }

  function badgeClass(s){
    return s === 'เสร็จสิ้น' ? 'b-done' : s === 'กำลังดำเนินการ' ? 'b-doing'
         : s === 'ยกเลิก' ? 'b-cancel' : s.indexOf('อะไหล่') !== -1 ? 'b-hold' : 'b-wait';
  }

  function render(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var mode = document.getElementById('fstatus').value;
    var bld = document.getElementById('fbuilding').value;
    var list = TICKETS.filter(function(t){
      if (bld && String(t.building) !== bld) return false;
      if (mode === 'open' && (t.status === 'เสร็จสิ้น' || t.status === 'ยกเลิก')) return false;
      if (!q) return true;
      return (t.id + ' ' + t.roomCode + ' ' + t.roomName + ' ' + t.items + ' ' +
              t.detail + ' ' + t.reporterName).toLowerCase().indexOf(q) !== -1;
    });

    var box = document.getElementById('list');
    box.className = '';
    if (!list.length) { box.innerHTML = '<p class="empty">ไม่มีงานตรงกับเงื่อนไขนี้</p>'; return; }

    box.innerHTML = list.map(function(t){
      var opts = STATUSES.map(function(s){
        return '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + s + '</option>';
      }).join('');
      var urgent = (t.severity === 'ใช้งานไม่ได้เลย' && t.status === 'รอดำเนินการ') ? ' urgent' : '';
      var b = BUILDINGS.filter(function(x){ return x.code === String(t.building); })[0];
      var bname = b ? (b.name || 'อาคาร ' + b.code) : '';
      return '<div class="card' + urgent + '">' +
        '<div class="head"><span class="id">' + t.id + '</span>' +
        '<span class="badge ' + badgeClass(t.status) + '">' + t.status + '</span></div>' +
        '<div class="room">' + (bname ? bname + ' · ' : '') + 'ห้อง ' + (t.roomCode ? t.roomCode + ' ' : '') + t.roomName + '</div>' +
        '<div class="meta">' + t.items + ' • <span class="sevtag">' + t.severity + '</span></div>' +
        '<p class="detail">' + t.detail + '</p>' +
        (t.photoUrl ? '<a class="photo" href="' + t.photoUrl + '" target="_blank" rel="noopener">ดูรูปที่แนบมา</a><br>' : '') +
        '<div class="meta">แจ้งโดย ' + t.reporterName + (t.phone ? ' (' + t.phone + ')' : '') + ' • ' + t.reportedAt + '</div>' +
        ownerBlock(t.assignee) +
        '<div class="edit">' +
          '<select id="st-' + t.id + '">' + opts + '</select>' +
          '<input type="text" id="as-' + t.id + '" placeholder="ผู้รับผิดชอบ" value="' + (t.assignee || '') + '">' +
          '<input class="full" type="text" id="nt-' + t.id + '" placeholder="บันทึกการซ่อม เช่น เปลี่ยนสาย HDMI แล้ว" value="' + (t.note || '') + '">' +
          '<div class="full"><button onclick="save(\'' + t.id + '\', this)">บันทึกการอัปเดต</button></div>' +
        '</div></div>';
    }).join('');
  }

  function ownerBlock(names){
    if (!names) return '';
    return String(names).split(',').map(function(raw){
      var name = raw.trim();
      if (!name) return '';
      var photo = PHOTOS[name] || '';
      var avatar = photo
        ? '<img src="' + photo + '" alt="" onerror="this.outerHTML=\'<div class=&quot;ph&quot;>' + name.charAt(0) + '</div>\'">'
        : '<div class="ph">' + name.charAt(0) + '</div>';
      return '<div class="owner">' + avatar +
             '<div><div class="role">ผู้รับผิดชอบ</div><div class="nm">' + name + '</div></div></div>';
    }).join('');
  }

  function save(id, btn){
    btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
    apiPost({
      action: 'update', id: id,
      status: document.getElementById('st-' + id).value,
      assignee: document.getElementById('as-' + id).value,
      note: document.getElementById('nt-' + id).value
    }, function(){
      document.getElementById('alert').innerHTML = '<div class="msg">อัปเดตงาน ' + id + ' แล้ว และแจ้งเข้า LINE เรียบร้อย</div>';
      load();
    }, function(e){
      document.getElementById('alert').innerHTML = '<div class="msg err">' + e.message + '</div>';
      btn.disabled = false; btn.textContent = 'บันทึกการอัปเดต';
    });
  }
</script>
</body>
</html>
